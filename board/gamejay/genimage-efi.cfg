image efi-part.vfat {
	vfat {
		label = "GAMEBOOT"
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 64M
}

image gamejay.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = C12A7328-F81F-11D2-BA4B-00A0C93EC93B
		offset = 1M
		bootable = true
	}

	partition root {
		image = "rootfs.ext2"
		partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
	}

	partition romdata {
		image = "romdata.exfat"
		partition-type-uuid = EBD0A0A2-B9E5-4433-87C0-68B6B72699C7
	}
}
