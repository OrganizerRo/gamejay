image gamejay-bios.img {
	hdimage {
	}

	partition boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition root {
		image = "rootfs.ext2"
		partition-type = 0x83
		bootable = true
	}

	partition romdata {
		image = "romdata.exfat"
		partition-type = 0x07
	}
}
