name: Build-gamejay-img

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/Build-gamejay-img.yml"
      - "board/**"
      - "configs/**"
      - "package/**"
      - "rootfs-overlay/**"
      - "Config.in"
      - "external.desc"
      - "external.mk"

permissions:
  contents: write

concurrency:
  group: build-gamejay-img-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILDROOT_VERSION: "2025.02.10"
      BUILDROOT_DIR: ${{ github.workspace }}/.buildroot
      OUTPUT_DIR: ${{ github.workspace }}/output

    steps:
      - name: Check out GameJay
        uses: actions/checkout@v4

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison build-essential cpio file flex git libelf-dev \
            libncurses-dev libssl-dev locales make patch perl python3 \
            rsync unzip wget xz-utils zip

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: gamejay-buildroot-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('configs/**', 'package/**/*.mk') }}
          restore-keys: |
            gamejay-buildroot-${{ env.BUILDROOT_VERSION }}-

      - name: Download pinned Buildroot release
        run: |
          wget --quiet "https://buildroot.org/downloads/buildroot-${BUILDROOT_VERSION}.tar.xz"
          tar -xf "buildroot-${BUILDROOT_VERSION}.tar.xz"
          mv "buildroot-${BUILDROOT_VERSION}" "${BUILDROOT_DIR}"

      - name: Configure GameJay
        run: |
          make -C "${BUILDROOT_DIR}" \
            O="${OUTPUT_DIR}" \
            BR2_EXTERNAL="${GITHUB_WORKSPACE}" \
            gamejay_x86_64_defconfig
          make -C "${BUILDROOT_DIR}" O="${OUTPUT_DIR}" olddefconfig

      - name: Build OS and raw images
        run: |
          make -C "${BUILDROOT_DIR}" \
            O="${OUTPUT_DIR}" \
            BR2_DL_DIR="${HOME}/.buildroot-ccache" \
            -j"$(nproc)"

      - name: Verify and compress images
        run: |
          test -s "${OUTPUT_DIR}/images/gamejay.img"
          test -s "${OUTPUT_DIR}/images/gamejay-bios.img"
          grep -q 'GameJay OS' "${OUTPUT_DIR}/images/efi-part/EFI/BOOT/grub.cfg"
          xz --threads=0 --compress --keep "${OUTPUT_DIR}/images/gamejay.img"
          xz --threads=0 --compress --keep "${OUTPUT_DIR}/images/gamejay-bios.img"
          (
            cd "${OUTPUT_DIR}/images"
            sha256sum gamejay.img.xz gamejay-bios.img.xz > SHA256SUMS
            zip -9 gamejay-images.zip \
              gamejay.img.xz \
              gamejay-bios.img.xz \
              SHA256SUMS
          )

      - name: Upload flashable images
        uses: actions/upload-artifact@v4
        with:
          name: gamejay-images-${{ github.sha }}
          path: |
            output/images/gamejay-images.zip
            output/images/gamejay.img.xz
            output/images/gamejay-bios.img.xz
            output/images/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Define release
        id: release
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          release_tag="gamejay-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_sha}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          Bootable GameJay OS images built from commit \`${GITHUB_SHA}\`.

          ## Downloads

          - [GameJay image bundle (ZIP)](${asset_base}/gamejay-images.zip) - both images and checksums
          - [64-bit UEFI image](${asset_base}/gamejay.img.xz) - preferred for modern PCs
          - [Legacy BIOS image](${asset_base}/gamejay-bios.img.xz) - for older PCs
          - [SHA-256 checksums](${asset_base}/SHA256SUMS)

          Decompress the appropriate \`.xz\` image before writing it with \`dd\`,
          RawWrite, Rufus in DD mode, balenaEtcher, or WSL. Writing an image
          erases the destination device.
          EOF

          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "GameJay OS ${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${OUTPUT_DIR}/images/gamejay-images.zip#GameJay image bundle" \
            "${OUTPUT_DIR}/images/gamejay.img.xz#64-bit UEFI image" \
            "${OUTPUT_DIR}/images/gamejay-bios.img.xz#Legacy BIOS image" \
            "${OUTPUT_DIR}/images/SHA256SUMS#SHA-256 checksums"

      - name: Publish release link
        run: |
          echo "## GameJay release" >> "${GITHUB_STEP_SUMMARY}"
          echo "[Download GameJay images](${{ steps.release.outputs.url }})" \
            >> "${GITHUB_STEP_SUMMARY}"
